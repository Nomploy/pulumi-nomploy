[project]
name = "nomploy-pulumi"
version = "0.1.0"
description = "Pulumi dynamic provider for nomploy (Python)."
requires-python = ">=3.8"
dependencies = ["pulumi>=3.0.0,<4.0.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nomploy_pulumi"]
